name: Validate rule package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test with PowerShell 7
        shell: pwsh
        run: ./tests/coding-rules.tests.ps1
      - name: Test with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\coding-rules.tests.ps1
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne $expected) {
            throw "Release tag must be $expected"
          }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
